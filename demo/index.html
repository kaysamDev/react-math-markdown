<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-math-markdown Demo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f0f2f5;
        color: #1a1a1a;
      }
      #root { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Polyfill Node.js globals needed by Draft.js / fbjs in the browser
      window.global = window;
      window.setImmediate = window.setImmediate || ((fn, ...args) => setTimeout(fn, 0, ...args));
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
